# Configuração do CTI Insights (backend).
# Os valores vêm do arquivo backend/cti_insights/.env (copie de .env.example).
# Se a variável não existir, vale o padrão depois dos ":".

# ---- Servidor web ----
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# ---- Spring ----
# lê o arquivo .env desta pasta (o Spring NÃO faz isso sozinho sem esta linha)
spring.config.import=optional:file:.env[.properties]
spring.application.name=cti-insights

# ---- Banco PostgreSQL (Azure ou Neon) ----
# Azure: jdbc:postgresql://SERVIDOR.postgres.database.azure.com:5432/BANCO?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ctiinsights}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=240000

# ---- JPA ----
spring.jpa.open-in-view=false
# As tabelas vêm do schema.sql. O Hibernate NÃO cria nem altera nada
# (antes estava "update", que misturava as suas tabelas com as que o Python grava).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Criação das tabelas ao ligar (schema.sql usa CREATE TABLE IF NOT EXISTS) ----
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ---- JWT ----
# segredo que assina o token: mínimo 32 caracteres. NUNCA deixe o padrão em produção.
app.jwt.secret=${JWT_SECRET:troque-este-segredo-em-producao-0123456789}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# ---- CORS: quem pode chamar a API (o front do Vite) ----
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}

# ---- Administrador criado na primeira vez ----
app.admin.nome=${ADMIN_NOME:Administrador}
app.admin.email=${ADMIN_EMAIL:admin@cti.local}
app.admin.senha=${ADMIN_PASSWORD:Admin@12345}

# ---- Upload ----
app.upload.max-linhas=${UPLOAD_MAX_LINHAS:5000}

# ---- Ligação com o Python (ETL) ----
app.etl.url=${ETL_URL:http://localhost:8000/etl}
app.etl.key=${ETL_KEY:}

logging.level.root=INFO
logging.level.com.senai.cti_insights=INFO
